# ─────────────────────────────────────────────────────────────────────────────
# Claude 자동 개발 — 이슈만 쓰면 코드 수정부터 배포까지 끝
#
#   트리거: 이슈/댓글/리뷰에 "@claude" 를 쓰거나, 이슈에 'claude' 라벨을 붙인다.
#           또는 queue.yml 이 'queue' 라벨 이슈를 하나씩 꺼내 workflow_dispatch(issue=N) 로 호출한다.
#   흐름  : Claude 가 브랜치에서 코드 수정 → CI(정적 검사+스모크) 검증
#           ├ 통과 → PR 생성 · main 자동 머지 · 릴리스(버전업/EXE/APK/Pages)
#           └ 실패 → Claude 가 로그를 보고 1회 자동 수정 → 재검증
#                     ├ 통과 → 머지 · 릴리스
#                     └ 실패 → PR 만 열고 'needs-human' 라벨 + 이슈에 알림
#
# 필요 시크릿: CLAUDE_CODE_OAUTH_TOKEN (Pro/Max 구독, `claude setup-token`)
#              또는 ANTHROPIC_API_KEY  — 둘 중 하나
# 선택 앱   : Claude GitHub App — 없어도 동작(GITHUB_TOKEN 사용). 설치하면 댓글 작성자가 claude[bot] 으로 표시됨
# ─────────────────────────────────────────────────────────────────────────────
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 처리할 이슈 번호 (작업 큐 모드)
        required: true
        type: string

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}
  cancel-in-progress: false

env:
  ISSUE_NO: ${{ github.event.issue.number || github.event.pull_request.number || inputs.issue }}

jobs:
  claude:
    name: Claude 작업
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.comment.user.type != 'Bot') ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action != 'labeled' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    outputs:
      branch: ${{ steps.claude.outputs.branch_name || steps.push.outputs.branch }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Claude 가 스스로 `npm test` 로 검증할 수 있도록 도구를 미리 설치
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:setup

      # ── 작업 큐 모드 (workflow_dispatch) ─────────────────────────────────
      - name: 큐 작업 준비
        id: prep
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BR="claude/issue-${ISSUE_NO}-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BR"
          git config user.name  "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"
          gh issue view "$ISSUE_NO" --json title,body --jq '"# 이슈 #'"$ISSUE_NO"': " + .title + "\n\n" + .body' > .claude-task.md
          gh issue comment "$ISSUE_NO" --body "🤖 작업 큐에서 이 이슈를 시작했습니다. 브랜치: \`$BR\` · [실행 로그](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"

      - name: Claude Code (작업 큐)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true   # 턴 제한 등으로 중단돼도 지금까지의 작업은 푸시해 검증·자동수정 단계로 넘긴다
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}   # Claude GitHub App 없이도 동작 (PR 생성·머지는 워크플로가 직접 처리)
          allowed_bots: github-actions                 # 큐/머지 단계가 github-actions 로 실행을 시작하므로 허용
          prompt: |
            저장소 루트의 `.claude-task.md` 에 이번에 처리할 GitHub 이슈 내용이 있다. 그 작업을 끝까지 수행하라.

            순서:
            1. `CLAUDE.md` 와 (UI 개편 작업이면) `docs/UI-REVAMP-PLAN.md` 를 먼저 읽는다.
            2. `.claude-task.md` 의 범위와 완료 기준만 구현한다. 다른 단계 범위는 건드리지 않는다.
            3. 기존 DOM id·함수·IPC 를 바꿀 땐 grep 으로 모든 참조를 찾아 함께 고친다.
            4. `npm test` 가 통과할 때까지 고친다. 검사 스크립트(scripts/)를 느슨하게 바꾸는 것은 금지.
            5. Conventional Commits 형식(한국어 요약)으로 커밋한다. 의미 단위로 여러 커밋도 좋다.
            6. 마지막에 `git push -u origin HEAD` 로 현재 브랜치(${{ steps.prep.outputs.branch }})를 푸시한다.
            버전 번호·CHANGELOG 는 수정하지 않는다. `.claude-task.md` 는 커밋하지 않는다(.gitignore 됨).
          claude_args: |
            --max-turns 200
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,TodoWrite,Bash(npm test),Bash(npm run check),Bash(npm run smoke),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(grep:*),Bash(wc:*),Bash(sed -n:*),Bash(cat .claude-task.md)"

      - name: 결과 푸시 확인
        id: push
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BR: ${{ steps.prep.outputs.branch }}
        run: |
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git push -u origin HEAD
            echo "branch=$BR" >> "$GITHUB_OUTPUT"
          else
            gh issue edit "$ISSUE_NO" --add-label needs-human
            gh issue comment "$ISSUE_NO" --body "⚠️ Claude 가 커밋을 만들지 못했습니다. 실행 로그를 확인하고 이슈 내용을 보완한 뒤 \`in-progress\` 라벨을 지우고 \`queue\` 라벨을 다시 붙여 주세요."
          fi

      # ── 이슈/댓글 모드 (@claude · claude 라벨) ───────────────────────────
      - name: Claude Code
        id: claude
        if: github.event_name != 'workflow_dispatch'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}   # Claude GitHub App 없이도 동작 (PR 생성·머지는 워크플로가 직접 처리)
          label_trigger: claude
          track_progress: true
          additional_permissions: |
            actions: read
          claude_args: |
            --max-turns 80
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,TodoWrite,Bash(npm test),Bash(npm run check),Bash(npm run smoke),Bash(node scripts/check-syntax.mjs),Bash(node scripts/smoke.mjs),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(grep:*),Bash(wc:*),Bash(sed -n:*)"
            --append-system-prompt "저장소 루트의 CLAUDE.md 규칙을 반드시 따른다. 코드를 바꿨다면 커밋 전에 'npm test' 를 실행해 통과시킨다. 커밋 메시지는 Conventional Commits(feat:/fix:/refactor:/style:/chore:) + 한국어 요약으로 쓴다. 버전 번호·CHANGELOG 는 절대 직접 수정하지 않는다(릴리스 워크플로가 자동 처리). 작업이 끝나면 PR 을 만들 필요 없다 — 워크플로가 검증 후 자동으로 PR 생성·머지·배포한다."

  verify:
    name: 검증
    needs: claude
    if: needs.claude.outputs.branch != ''
    uses: ./.github/workflows/ci.yml
    permissions:   # 재사용되는 ci.yml 의 automerge 잡이 요구하는 권한 전부 (부족하면 startup_failure)
      contents: write
      pull-requests: write
      issues: write
      actions: write
    with:
      ref: ${{ needs.claude.outputs.branch }}

  ship:
    name: PR · 머지 · 배포
    needs: [claude, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - run: bash .github/scripts/ship-branch.sh "${{ needs.claude.outputs.branch }}" "$ISSUE_NO" true

  repair:
    name: 자동 수정 (1회)
    needs: [claude, verify]
    if: always() && needs.verify.result == 'failure' && needs.claude.outputs.branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      BRANCH: ${{ needs.claude.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.claude.outputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:setup

      - name: 실패 로그 수집
        run: |
          npm test > test.log 2>&1 || true
          tail -c 12000 test.log > test-tail.log
          cat test-tail.log

      - name: git 사용자 설정
        run: |
          git config user.name  "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"

      - name: Claude 자동 수정
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}   # Claude GitHub App 없이도 동작 (PR 생성·머지는 워크플로가 직접 처리)
          allowed_bots: github-actions
          prompt: |
            브랜치 `${{ needs.claude.outputs.branch }}` 의 변경이 CI 검사(`npm test` = 정적 검사 + 스모크 테스트)를 통과하지 못했다.
            아래 로그(test-tail.log)를 분석해 원인을 고치고, `npm test` 가 통과하는 것을 확인한 뒤
            `fix: ...` 형식으로 커밋하고 `git push origin HEAD:${{ needs.claude.outputs.branch }}` 로 푸시하라.
            CLAUDE.md 규칙을 따른다. 버전·CHANGELOG 는 건드리지 않는다. 검사 스크립트(scripts/)를 느슨하게 고쳐서 통과시키는 것은 금지.

            원래 요청: 이슈/PR #${{ env.ISSUE_NO }}
          claude_args: |
            --max-turns 80
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(npm test),Bash(npm run check),Bash(npm run smoke),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(cat test-tail.log),Bash(grep:*),Bash(sed -n:*)"

      - name: 재검증
        id: recheck
        run: |
          git fetch origin "$BRANCH" main && git checkout -q "origin/$BRANCH"
          git checkout origin/main -- scripts/   # 검사 기준은 main 의 스크립트로 고정
          if npm test; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: 머지 또는 보류
        run: bash .github/scripts/ship-branch.sh "$BRANCH" "$ISSUE_NO" "${{ steps.recheck.outputs.ok }}"
