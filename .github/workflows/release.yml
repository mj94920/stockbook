# ─────────────────────────────────────────────────────────────────────────────
# Release — main 에 변경이 들어오면 사람 손 없이 끝까지 배포
#   검사 → 버전 자동 증가(커밋 메시지 기반) → 태그
#        → Windows NSIS 설치파일(EXE) 빌드 → GitHub Release 게시 + Pages 갱신
#   마지막 태그 이후 새 커밋이 없으면(연속 머지로 앞선 실행이 이미 릴리스) 아무것도 하지 않는다.
# 수동 실행: Actions 탭 → Release → Run workflow (bump 수준 선택 가능)
# ─────────────────────────────────────────────────────────────────────────────
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/**'   # 워크플로·템플릿 변경은 앱 릴리스 불필요
      - '.claude/**'
  workflow_dispatch:
    inputs:
      bump:
        description: 버전 증가 수준
        type: choice
        options: [auto, patch, minor, major, none]
        default: auto

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  actions: read

jobs:
  checks:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    uses: ./.github/workflows/ci.yml
    # 재사용 워크플로 안의 automerge 잡이 요구하는 권한 (실행은 안 되지만 검증 단계에서 필요)
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    with:
      ref: main

  version:
    name: 버전 증가 + 태그
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: v${{ steps.bump.outputs.version }}
      skip: ${{ steps.bump.outputs.skip || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 버전 계산 및 파일 갱신
        id: bump
        run: node scripts/bump-version.mjs "${{ inputs.bump || 'auto' }}"

      - name: 커밋 · 태그 · 푸시
        if: steps.bump.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A   # .release-notes.md 는 .gitignore 로 제외됨
          git diff --cached --quiet || git commit -m "chore(release): v${VERSION}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::태그 v${VERSION} 가 이미 존재합니다"; exit 1
          fi
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:main --follow-tags

  build-windows:
    name: Windows EXE (NSIS)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: electron-builder --win nsis
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 1   # 릴리스로 넘긴 뒤에는 필요 없음 (릴리스 첨부와 중복 저장 방지)

  publish:
    name: GitHub Release 게시
    needs: [version, build-windows]
    if: ${{ !cancelled() && needs.version.outputs.skip != 'true' && needs.build-windows.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: windows
          path: artifacts
          merge-multiple: true

      - name: 릴리스 노트 추출
        run: |
          awk -v t="## ${TAG} " 'index($0,t)==1{f=1;next} /^## v/{if(f)exit} f' CHANGELOG.md > notes.md
          {
            echo ""
            echo "---"
            echo "- 🖥️ Windows: \`Stock Book Setup *.exe\` 다운로드 후 설치"
            echo "- 🌐 웹: https://mj94920.github.io/stockbook/"
          } >> notes.md
          cat notes.md

      - name: 릴리스 생성
        run: |
          shopt -s nullglob
          gh release create "$TAG" artifacts/* --title "Stock Book ${TAG}" --notes-file notes.md --latest

      # Pages 가 '브랜치에서 배포' 모드일 때 GITHUB_TOKEN 커밋으로도 확실히 재빌드되도록 요청
      - name: GitHub Pages 재빌드 요청
        continue-on-error: true
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
