# 저장소 초기 설정 — 자동 개발에 필요한 라벨 생성 (이 파일이 main 에 처음 들어올 때 1회 자동 실행)
name: Repo Setup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repo-setup.yml']
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R: ${{ github.repository }}
    steps:
      - run: |
          gh label create claude      --repo "$R" --force --color 7057FF --description "Claude 자동 개발 대상 (붙이면 즉시 작업 시작)"
          gh label create automerge   --repo "$R" --force --color 0E8A16 --description "CI 통과 시 자동 머지"
          gh label create needs-human --repo "$R" --force --color D93F0B --description "자동 수정 실패 — 사람 확인 필요"
