<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상세 차트</title>
<style>
:root{color-scheme:dark;--sb-bg:#0b0f19;--sb-panel:#111827;--sb-surface:#1f2937;--sb-text-1:#f3f4f6;--sb-text-2:#9ca3af;--sb-border:#374151;--sb-accent:#4f46e5;--sb-warn:#f59e0b;--sb-overlay:rgba(0,0,0,.6)}*{box-sizing:border-box}body{margin:0;background:var(--sb-bg);color:var(--sb-text-1);font:14px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--sb-border);background:var(--sb-panel)}h1{font-size:18px;margin:0;margin-right:auto}label{display:flex;align-items:center;gap:6px}select{background:var(--sb-surface);color:inherit;border:1px solid var(--sb-border);padding:6px}#chartViewport{flex:1;min-height:0;overflow:auto;margin:12px;border:1px solid var(--sb-border)}.sb-chart-pending{height:100%;display:grid;place-content:center;text-align:center;color:var(--sb-text-2);gap:8px}#chartStatus{padding:0 16px 12px;color:var(--sb-text-2)}
</style><link rel="stylesheet" href="src/chart/chart.css"></head><body class="sb-chart-window"><header><h1 id="chartName">상세 차트</h1><label>봉 주기 <select id="chartCycle"><option value="day">일봉</option><option value="week">주봉</option><option value="month">월봉</option><option value="year">연봉</option></select></label><label>조회 범위 <select id="chartPeriod"><option value="1m">1개월</option><option value="3m">3개월</option><option value="6m">6개월</option><option value="1y">1년</option><option value="all">전체</option></select></label><button type="button" class="sb-btn" id="chartIndicatorSettings">지표 설정</button><label>종목 연결 <select id="chartFollow"><option value="follow">선택 종목 따라가기</option><option value="pin">현재 종목 고정</option></select></label></header><main id="chartViewport" data-chart-host><div class="sb-chart-pending"><strong>차트 모듈 연결 대기</strong><span>종목·기간은 유지되며 차트 원본 연결 후 표시됩니다.</span></div></main><div id="chartStatus" role="status"></div><dialog id="chartSettings" class="sb-modal sb-modal--s"><form method="dialog" id="chartSettingsForm"><div class="sb-modal__head"><strong>지표 조건</strong><button type="button" class="sb-btn" id="chartSettingsClose">닫기</button></div><div class="sb-modal__body"><label>종가 단순 이평 기간<input class="sb-input" id="chartMAPeriods" placeholder="예: 4,12,24,46,73"></label><p>쉼표로 구분합니다. 단위는 선택한 봉 주기입니다.</p><label id="chartCloudFields">산·우물 구름 기간<input class="sb-input" id="chartCloudPeriods" placeholder="예: 1,4"></label><fieldset id="chartBBFields"><legend>BB 상한선</legend><label>기간<input id="chartBBPeriod" class="sb-input" type="number" min="2" max="500"></label><label>배수<input id="chartBBMultiplier" class="sb-input" type="number" step="0.1" min="0" max="10"></label><label>이동 봉 수<input id="chartBBShift" class="sb-input" type="number" min="0" max="120"></label></fieldset><p id="chartSettingsError" role="status"></p></div><div class="sb-modal__foot"><button type="button" class="sb-btn" id="chartSettingsReset">주기 기본값</button><button type="submit" class="sb-btn">적용</button></div></form></dialog><script src="src/chart/series.js"></script><script src="src/chart/renderer.js"></script><script src="src/chart/interaction.js"></script><script src="src/chart/client.js"></script><script src="src/chart/detail.js"></script></body></html>
