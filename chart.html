<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상세 차트</title>
<style>
:root{color-scheme:dark;--sb-bg:#0b0f19;--sb-panel:#111827;--sb-surface:#1f2937;--sb-text-1:#f3f4f6;--sb-text-2:#9ca3af;--sb-border:#374151;--sb-accent:#4f46e5}*{box-sizing:border-box}body{margin:0;background:var(--sb-bg);color:var(--sb-text-1);font:14px system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--sb-border);background:var(--sb-panel)}h1{font-size:18px;margin:0;margin-right:auto}label{display:flex;align-items:center;gap:6px}select{background:var(--sb-surface);color:inherit;border:1px solid var(--sb-border);padding:6px}#chartViewport{flex:1;min-height:0;overflow:auto;margin:12px;border:1px solid var(--sb-border)}.sb-chart-pending{height:100%;display:grid;place-content:center;text-align:center;color:var(--sb-text-2);gap:8px}#chartStatus{padding:0 16px 12px;color:var(--sb-text-2)}
</style><link rel="stylesheet" href="src/chart/chart.css"></head><body><header><h1 id="chartName">상세 차트</h1><span id="chartPeriod"></span><label>종목 연결 <select id="chartFollow"><option value="follow">선택 종목 따라가기</option><option value="pin">현재 종목 고정</option></select></label></header><main id="chartViewport" data-chart-host><div class="sb-chart-pending"><strong>차트 모듈 연결 대기</strong><span>종목·기간은 유지되며 차트 원본 연결 후 표시됩니다.</span></div></main><div id="chartStatus" role="status"></div><script src="src/chart/renderer.js"></script><script src="src/chart/client.js"></script><script src="src/chart/detail.js"></script></body></html>
