q('[data-filter-toggle]').hidden=type==='disclosure';if(type==='disclosure'){const samples=[['예시 기업 A','분기보고서','정기공시','제출일 표시'],['예시 기업 B','[기재정정] 주요사항보고서','정정','제출일 표시'],['예시 기업 C','주요사항보고서','주요사항','제출일 표시']];samples.forEach(([company,title,kind,date])=>{const article=document.createElement('article');article.className='article text-article';const top=document.createElement('div');top.className='filing-top';const name=document.createElement('span');name.className='publisher';name.textContent=company;const tag=document.createElement('span');tag.className='filing-kind'+(kind==='정정'?' correction':'');tag.textContent=kind;top.append(name,tag);const h=document.createElement('h3');h.textContent=title;const meta=document.createElement('div');meta.className='sample';meta.textContent=date+' · 전자공시';const button=document.createElement('button');button.type='button';button.className='filing-open cursor-interaction';button.textContent='원문 보기 ↗';button.onclick=()=>{const note=article.querySelector('.filing-note');note.hidden=!note.hidden;};const note=document.createElement('div');note.className='filing-note';note.hidden=true;note.textContent='실제 공시 연결 전 예시입니다. 이 위치에서 해당 공시 원문을 엽니다.';article.append(top,h,meta,button,note);out.append(article);});const hint=document.createElement('div');hint.className='sample';hint.style.textAlign='center';hint.textContent='기업·문서 조합은 공시 화면용 가상 예시';out.append(hint);return;}const filtered=rows.filter(r=>active.has(r.media));if(!filtered.length){const p=document.createElement('div');p.className='empty';p.textContent='선택한 조건의 기사가 없습니다.';const reset=document.createElement('button');reset.type='button';reset.textContent='전체 언론사 보기';reset.onclick=()=>{active=new Set(media);root.querySelectorAll('[data-publishers] input').forEach(el=>el.checked=true);q('[data-filter-toggle]').textContent='필터';render();};p.append(reset);out.append(p);}filtered.forEach(r=>{const a=document.createElement('a');a.className='article cursor-interaction'+(r.image?'':' text-article');a.href=r.url;a.target='_blank';a.rel='noopener noreferrer';if(r.image){const img=document.createElement('img');img.className='hero';img.src=r.image;img.alt=r.media+' 기사 사진';a.append(img);}const copy=document.createElement('div');if(r.image)copy.className='copy';const pub=document.createElement('div');pub.className='publisher';pub.textContent=r.media;const h=document.createElement('h3');h.textContent=r.title;const meta=document.createElement('div');meta.className='caption';const time=document.createElement('time');time.textContent=r.date;time.dateTime=r.date.replaceAll('.','-');const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='원문 ↗';meta.append(time,arrow);copy.append(pub,h,meta);a.append(copy);out.append(a);});}root.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{type=b.dataset.type;root.querySelectorAll('[data-type]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));q('[data-filter-box]').hidden=true;q('[data-filter-toggle]').setAttribute('aria-expanded','false');render();});q('[data-filter-toggle]').onclick=()=>{const box=q('[data-filter-box]');box.hidden=!box.hidden;root.querySelectorAll('[data-publishers] input').forEach(el=>el.checked=active.has(el.value));q('[data-filter-toggle]').setAttribute('aria-expanded',String(!box.hidden));draftCount();};q('[data-reset]').onclick=()=>{root.querySelectorAll('[data-publishers] input').forEach(el=>el.checked=true);draftCount();};function draftCount(){q('[data-apply]').textContent='적용 · '+root.querySelectorAll('[data-publishers] input:checked').length+'개 언론사';}q('[data-publishers]').addEventListener('change',draftCount);q('[data-apply]').onclick=()=>{active=new Set(Array.from(root.querySelectorAll('[data-publishers] input:checked')).map(el=>el.value));q('[data-filter-box]').hidden=true;q('[data-filter-toggle]').setAttribute('aria-expanded','false');q('[data-filter-toggle]').textContent=active.size===media.length?'필터':'필터 · '+active.size;render();};root.querySelectorAll('[data-type]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.type===type)));render();})();
