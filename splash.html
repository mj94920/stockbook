<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0f19;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 16px;
    animation: fadeUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .logo-img {
    width: 64px;
    height: 64px;
    filter: drop-shadow(0 0 18px rgba(79,70,229,0.7));
    animation: pulse 2s ease-in-out infinite;
  }

  .logo-text {
    font-size: 36px;
    font-weight: 700;
    color: #f3f4f6;
    letter-spacing: -0.5px;
  }

  .version {
    font-size: 13px;
    color: #6b7280;
    margin-top: 8px;
    letter-spacing: 0.04em;
    animation: fadeUp 0.6s 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    text-align: center;
  }

  .tagline {
    font-size: 14px;
    color: #4f46e5;
    margin-top: 6px;
    font-weight: 500;
    animation: fadeUp 0.6s 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    text-align: center;
  }

  .progress-bar {
    width: 200px;
    height: 2px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    margin-top: 40px;
    overflow: hidden;
    animation: fadeUp 0.6s 0.5s ease both;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4f46e5, #7c3aed);
    border-radius: 2px;
    animation: load 1.4s 0.5s ease-out forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 18px rgba(79,70,229,0.7)); }
    50%       { filter: drop-shadow(0 0 28px rgba(79,70,229,1)); }
  }

  @keyframes load {
    0%   { width: 0%; }
    60%  { width: 80%; }
    100% { width: 100%; }
  }
</style>
</head>
<body>
  <div class="logo-wrap">
    <img src="./logo.svg" class="logo-img" alt="logo">
    <span class="logo-text">Stock Book</span>
  </div>
  <div class="tagline">주식 포트폴리오 관리</div>
  <div class="version">v2.0.0</div>
  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>
</body>
</html>
